version: '3.8'

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: rumah_pramuka_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: rumah_pramuka
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
