version: '3.8'

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: rumah_pramuka_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: rumah_pramuka
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional: pgAdmin for DB management
  # pgadmin:
  #   image: dpage/pgadmin4:latest
  #   container_name: rumah_pramuka_pgadmin
  #   environment:
  #     PGADMIN_DEFAULT_EMAIL: admin@pramuka.local
  #     PGADMIN_DEFAULT_PASSWORD: pgadminpass
  #   ports:
  #     - "5050:80"
  #   depends_on:
  #     - db

volumes:
  pgdata:
